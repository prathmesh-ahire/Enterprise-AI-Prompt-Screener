name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # mvnw is committed without the executable bit (written from a Windows dev machine,
      # where that bit isn't tracked) - chmod it here rather than falling back to plain
      # `mvn`, so CI uses the exact Maven version (3.9.16) pinned in
      # .mvn/wrapper/maven-wrapper.properties, the same one used throughout local dev.
      - name: Make mvnw executable
        run: chmod +x mvnw

      # Runs against the "test" Spring profile (application-test.yml, H2 in-memory DB) -
      # no MySQL/Ollama service container needed in this workflow.
      - name: Run backend tests
        run: ./mvnw -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
