spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL}
      chat:
        model: ${OLLAMA_MODEL}

app:
  ai-gateway:
    timeout-ms: ${AI_GATEWAY_TIMEOUT_MS:30000}
    max-response-tokens: 500
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
    email: ${ADMIN_EMAIL}
  seed:
    default-model: ${OLLAMA_MODEL:llama3.2}
  jwt:
    secret: ${JWT_SECRET}
  cors:
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  rate-limit:
    prompt-per-minute: 10
    auth-per-minute: 5
