spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
    email: ${ADMIN_EMAIL}
  seed:
    default-model: ${OLLAMA_MODEL:llama3.2}
  jwt:
    secret: ${JWT_SECRET}
  cors:
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
